name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.20

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test unit, integration, privacy, regression, and E2E paths
        run: |
          mkdir -p test-results
          uv run pytest -q --basetemp=.pytest-tmp-ci \
            --cov=src --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --cov-fail-under=80 \
            --junitxml=test-results/junit.xml

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: sheetpilot-beacon-quality
          path: |
            test-results/
            dist/
            docs/assets/sheetpilot-beacon-ui.png
          if-no-files-found: error
          retention-days: 14

  cross-platform:
    name: ${{ matrix.os }} runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.20

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras

      - name: Run all tests
        run: uv run pytest -q --basetemp=.pytest-tmp-matrix

      - name: Exercise installed CLI
        run: >
          uv run sheetpilot scan examples/budget_model.xlsx
          --output-dir smoke-output
