name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package, and publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out annotated tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.20

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras

      - name: Build release bundle
        run: uv run python scripts/package_release.py

      - name: Run release gate
        run: uv run python scripts/release_check.py

      - name: Publish GitHub Release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist-release/*
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --generate-notes
