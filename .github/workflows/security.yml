name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.20

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras

      - name: Export locked runtime requirements
        run: >
          uv export --frozen --no-emit-project
          --format requirements-txt
          --output-file audited-requirements.txt

      - name: Audit runtime dependencies
        run: >
          uv run pip-audit --strict --require-hashes
          --requirement audited-requirements.txt
          --format json --output dependency-audit.json

      - name: Scan repository for credential patterns
        run: uv run python scripts/secret_scan.py

      - name: Upload dependency evidence
        uses: actions/upload-artifact@v7
        with:
          name: sheetpilot-beacon-dependency-audit
          path: |
            audited-requirements.txt
            dependency-audit.json
          if-no-files-found: error
          retention-days: 30
