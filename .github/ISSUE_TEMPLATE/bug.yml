name: Bug report
description: Report a reproducible parser, detector, export, or interface defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only. Do not upload confidential workbooks."
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workbook parsing
        - Dependency graph
        - Risk detection
        - Version diff
        - Export
        - CLI
        - Streamlit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands and a minimal synthetic workbook recipe.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
